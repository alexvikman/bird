# Builds Bird's PHP binaries (php + php-fpm + shared extensions) with
# static-php-cli and publishes them to the rolling `php` GitHub Release,
# together with manifest.json and its signature. See php-builds/README.md.
#
# Runs on manual dispatch and weekly (Mondays 04:00 UTC). The weekly run only
# builds what the published manifest.json lacks: new PHP patch releases, and
# every version again when the build files changed (see `manifest.py recipe`).
#
# Bird trusts the builds only through manifest.json.sig, made with the PHP key
# (`ssh-keygen -Y sign -n bird-php`, PHP_KEYS in src/signing.rs). The key is a
# secret of the `php-release` environment, which only main can use and which
# requires the owner's approval: pushing to the repository or editing the
# release can't produce a manifest Bird accepts.
#
# Hardening: never runs on pull requests or other events from forks, the token
# is read-only except in the publish job, inputs reach shells only through env,
# checkout keeps no credentials, and every action is pinned to a commit SHA
# (Dependabot keeps the pins current). Builds use no Actions cache: spc does
# not re-check sources it finds already downloaded, and a cache on main can be
# written by any other workflow run there.
#
# What goes into a build is pinned and verified by build.sh before anything is
# compiled (php-builds/README.md, "Sources"). What comes out of a build job is
# not trusted either: the publish job takes each job's artifact on its own and
# only accepts the build that job itself reported, for the version and
# platform it was given (`manifest.py merge`), so one compromised job cannot
# replace another's build.
name: PHP builds

on:
  workflow_dispatch:
    inputs:
      versions:
        description: PHP versions, comma separated (8.4 = latest 8.4.x, or an exact 8.4.26)
        type: string
        default: "8.1,8.2,8.3,8.4,8.5"
      platforms:
        description: Platforms, comma separated
        type: string
        default: "macos-aarch64,macos-x86_64,linux-aarch64,linux-x86_64"
      prebuilt-libs:
        description: Use spc's pre-built static libraries (faster, but unverified; cannot be published)
        type: boolean
        default: false
      only-missing:
        description: Skip builds already published with the current build files
        type: boolean
        default: false
      publish:
        description: Upload to the `php` release and update manifest.json (main only; with nothing to build, re-signs the manifest)
        type: boolean
        default: false
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

env:
  RELEASE_TAG: php

jobs:
  plan:
    name: Resolve versions
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: plan
        env:
          # Scheduled runs have no inputs: all supported versions, only what is
          # missing from the release, and publish (see the publish job).
          VERSIONS: ${{ inputs.versions || '8.1,8.2,8.3,8.4,8.5' }}
          PLATFORMS: ${{ inputs.platforms || 'macos-aarch64,macos-x86_64,linux-aarch64,linux-x86_64' }}
          ONLY_MISSING: ${{ github.event_name == 'schedule' || inputs.only-missing }}
          PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish }}
          PREBUILT: ${{ inputs.prebuilt-libs }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$PUBLISH" = "true" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Publishing only runs from main (the php-release environment); this is $GITHUB_REF."
            exit 1
          fi
          if [ "$PUBLISH" = "true" ] && [ "$PREBUILT" = "true" ]; then
            echo "Builds with spc's pre-built libraries cannot be verified and are never published."
            exit 1
          fi
          skip=()
          if [ "$ONLY_MISSING" = "true" ]; then
            mkdir -p published
            # No release yet means nothing to skip; any other error stops here
            # rather than rebuilding (and republishing) everything.
            if found="$(gh release view "$RELEASE_TAG" --json tagName 2>&1)"; then
              gh release download "$RELEASE_TAG" --pattern manifest.json --dir published
              skip=(--skip-published published/manifest.json)
            elif ! grep -q "release not found" <<<"$found"; then
              echo "$found"
              exit 1
            fi
          fi
          matrix="$(python3 php-builds/manifest.py matrix "$VERSIONS" "$PLATFORMS" "${skip[@]}")"
          echo "$matrix" | jq .
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$(jq '.include | length' <<<"$matrix")" >> "$GITHUB_OUTPUT"

  build:
    name: PHP ${{ matrix.php }} (${{ matrix.platform }})
    needs: plan
    # Nothing new (the usual weekly case): skip the build, and with it publish.
    if: needs.plan.outputs.count != '0'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # build.sh checks php-src's OpenPGP signature with gpgv, which the
      # Ubuntu runners always have.
      - name: gpgv
        if: runner.os == 'macOS'
        run: command -v gpgv || brew install gnupg

      - name: Build
        env:
          PHP_VERSION: ${{ matrix.php }}
          SPC_PREBUILT: ${{ inputs.prebuilt-libs && '1' || '' }}
          # Higher GitHub API rate limit for spc's downloads from GitHub.
          GITHUB_TOKEN: ${{ github.token }}
        run: php-builds/build.sh "$PHP_VERSION" --out dist

      # Any job of this run could upload an artifact under this job's name.
      # An annotation, though, belongs to the job that writes it: the publish
      # job only accepts the build whose build file has the sha256 reported
      # here (and that file lists the sha256 of every archive).
      - name: Report the build
        env:
          BUILD: php-${{ matrix.php }}-${{ matrix.platform }}
        run: echo "::notice title=PHP build::bird-php-build $BUILD $(shasum -a 256 "dist/$BUILD.json" | cut -d' ' -f1)"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: php-${{ matrix.php }}-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-php-${{ matrix.php }}-${{ matrix.platform }}
          path: php-builds/.work/${{ matrix.platform }}/${{ matrix.php }}/log/
          if-no-files-found: ignore

  publish:
    name: Publish release
    needs: [plan, build]
    # Only from main (the php-release environment allows nothing else). Also
    # when a dispatch found nothing to build, to re-sign the manifest; a
    # scheduled run with nothing new publishes nothing. When some builds
    # failed, the ones that succeeded are still published (the run stays
    # failed); a cancelled build publishes nothing.
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      needs.plan.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'failure' ||
       (needs.build.result == 'skipped' && github.event_name == 'workflow_dispatch')) &&
      (github.event_name == 'schedule' || inputs.publish)
    runs-on: ubuntu-24.04
    # The signing key is a secret of this environment, which requires the
    # owner's approval before the job runs.
    environment: php-release
    permissions:
      contents: write
      # To read what each build job reported (its annotations).
      actions: read
      checks: read
    concurrency:
      group: php-builds-publish
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # This job can wait for approval for days. Once main has moved on, what
      # this run built may be older than what is published by now (another
      # recipe, an older version of this workflow): publish from a new run.
      - name: Still the head of main
        run: |
          head="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)"
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "main is at $head by now, and this run built $GITHUB_SHA: not publishing."
            echo "Run the workflow again from main."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only builds that succeeded upload a php-* artifact (failed ones only
      # logs-php-*), so a partial build publishes just the complete builds.
      # Each artifact gets its own directory, artifacts/php-<version>-<platform>:
      # merged into one, a job could overwrite the files of another.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.build.result != 'skipped'
        with:
          pattern: php-*
          path: artifacts

      - name: Check builds
        if: needs.build.result != 'skipped'
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          shopt -s nullglob
          built=(artifacts/*/)
          if [ "${#built[@]}" -eq 0 ]; then
            echo "No build uploaded anything: nothing to publish."
            exit 1
          fi
          if [ "$BUILD_RESULT" = "failure" ]; then
            echo "::warning::some builds failed; publishing the ${#built[@]} that succeeded"
          fi

      # What each build job said it built: its name, as GitHub derives it
      # from the matrix, and the lines of its annotations. `manifest.py merge`
      # picks out the reports and only hears a job about its own build.
      - name: Build reports
        if: needs.build.result != 'skipped'
        run: |
          gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/jobs?filter=latest&per_page=100" \
            --jq '.jobs[] | select(.name | startswith("PHP ")) | [.check_run_url, .name] | @tsv' > "$RUNNER_TEMP/jobs.tsv"
          : > "$RUNNER_TEMP/reports.tsv"
          while IFS=$'\t' read -r check_run name; do
            messages="$(gh api "$check_run/annotations?per_page=100" --jq '.[].message')"
            while IFS= read -r line; do
              printf '%s\t%s\n' "$name" "$line" >> "$RUNNER_TEMP/reports.tsv"
            done <<<"$messages"
          done < "$RUNNER_TEMP/jobs.tsv"
          cat "$RUNNER_TEMP/reports.tsv"

      - name: Allowed signers
        run: |
          # The keys compiled into Bird: the signature must verify against
          # them, or Bird would refuse the manifest.
          awk '/^pub const PHP_KEYS/,/\];$/' src/signing.rs |
            grep -oE '"ssh-ed25519 [A-Za-z0-9+/=]+[^"]*"' | tr -d '"' |
            sed 's/^/bird-php /' > "$RUNNER_TEMP/allowed_signers"
          [ -s "$RUNNER_TEMP/allowed_signers" ] || { echo "src/signing.rs has no PHP_KEYS"; exit 1; }
          cat "$RUNNER_TEMP/allowed_signers"

      - name: Create the release if missing
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --latest=false --title "PHP builds" \
              --notes "PHP binaries for Bird, built by .github/workflows/php-builds.yml. See manifest.json (signed: manifest.json.sig)."
          fi

      - name: Merge manifest.json
        env:
          MATRIX: ${{ needs.plan.outputs.matrix }}
        run: |
          mkdir -p dist previous
          # Captured first: run steps use pipefail, and `grep -q` exiting early
          # would SIGPIPE gh and fail the step.
          assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          if grep -qx manifest.json <<<"$assets"; then
            gh release download "$RELEASE_TAG" --pattern manifest.json --dir previous
            # Its builds are signed again below, so they must be ones we signed
            # before: anyone who can edit the release can replace this file.
            # There is no way to adopt an unsigned one from here; that would
            # sign whatever someone put there after deleting the signature.
            if grep -qx manifest.json.sig <<<"$assets"; then
              gh release download "$RELEASE_TAG" --pattern manifest.json.sig --dir previous
              ssh-keygen -Y verify -f "$RUNNER_TEMP/allowed_signers" -I bird-php -n bird-php \
                -s previous/manifest.json.sig < previous/manifest.json
            else
              echo "The published manifest.json has no manifest.json.sig; not signing over it."
              echo "Put the last signed manifest.json and manifest.json.sig back on the release first."
              exit 1
            fi
          fi
          # Nothing a build job uploaded is taken on trust: every artifact
          # must be a build this run planned and the one its own job
          # reported, describe only its own version and platform, and list
          # exactly its own files with their real size and sha256. One that
          # does not stops the publish. The archives of the accepted builds
          # are moved to dist/.
          touch "$RUNNER_TEMP/reports.tsv"
          python3 php-builds/manifest.py merge --existing previous/manifest.json --out dist/manifest.json \
            --artifacts artifacts --matrix "$MATRIX" --reports "$RUNNER_TEMP/reports.tsv" --collect dist
          cat dist/manifest.json

      - name: Sign manifest.json
        env:
          SIGNING_KEY: ${{ secrets.BIRD_PHP_SIGNING_KEY }}
        run: |
          [ -n "$SIGNING_KEY" ] || { echo "BIRD_PHP_SIGNING_KEY is not set in the php-release environment"; exit 1; }
          umask 077
          key="$RUNNER_TEMP/php-key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SIGNING_KEY" > "$key"
          rm -f dist/manifest.json.sig # ssh-keygen would ask before overwriting
          ssh-keygen -Y sign -f "$key" -n bird-php dist/manifest.json
          rm -f "$key"
          ssh-keygen -Y verify -f "$RUNNER_TEMP/allowed_signers" -I bird-php -n bird-php \
            -s dist/manifest.json.sig < dist/manifest.json

      - name: Upload assets
        run: |
          shopt -s nullglob
          # Archives first, so the manifest never points at missing files.
          # dist/ only holds what `manifest.py merge` accepted. Their names
          # carry their sha256 (build.sh, checked by merge), so this never
          # replaces a file the live manifest.json points at.
          archives=(dist/*.tar.gz)
          if [ "${#archives[@]}" -gt 0 ]; then
            gh release upload "$RELEASE_TAG" "${archives[@]}" --clobber
          fi
          # The signature before the manifest it signs. Until manifest.json
          # follows, Bird refuses the mismatched pair: installs fail for a few
          # seconds, but never trust a manifest that isn't signed.
          gh release upload "$RELEASE_TAG" dist/manifest.json.sig --clobber
          gh release upload "$RELEASE_TAG" dist/manifest.json --clobber
