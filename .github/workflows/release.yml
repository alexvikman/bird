# Publishes a Bird release when a version tag (v0.2.0) is pushed: the bird
# binary for macOS (arm64, x86_64) and Linux (x86_64, arm64, static musl),
# Bird.app for macOS, SHA256SUMS signed with Bird's release key
# (SHA256SUMS.sig, checked by `bird self-update`), and GitHub build
# provenance attestations (`gh attestation verify <file> -R alexvikman/bird`).
# `bird self-update` installs from here.
#
# Hardening: only people who can push tags can start it, the token is
# read-only except in the release job, nothing from the event reaches a shell
# except the tag name (through env, validated), and actions are SHA-pinned.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag $TAG is not vX.Y.Z"; exit 1; }
          version="${TAG#v}"
          cargo_version="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          [ "$version" = "$cargo_version" ] || { echo "tag $TAG does not match Cargo.toml version $cargo_version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  bird:
    name: bird (${{ matrix.target }})
    needs: check
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: aarch64-apple-darwin, runner: macos-15 }
          - { target: x86_64-apple-darwin, runner: macos-15-intel }
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install stable --profile minimal --target "$TARGET"
          rustup default stable
          if [[ "$TARGET" == *-linux-musl ]]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
          fi
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          cargo build --release --locked --target "$TARGET"
          mkdir -p dist pkg
          cp "target/$TARGET/release/bird" LICENSE README.md pkg/
          ./pkg/bird --version | grep -qx "bird $VERSION"
          tar -czf "dist/bird-$VERSION-$TARGET.tar.gz" -C pkg bird LICENSE README.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bird-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  app:
    name: Bird.app (${{ matrix.arch }})
    needs: check
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { arch: aarch64, runner: macos-15 }
          - { arch: x86_64, runner: macos-15-intel }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" app/Info.plist
          app/build.sh
          mkdir -p dist
          ditto -c -k --keepParent app/build/Bird.app "dist/Bird-$VERSION-macos-$ARCH.app.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  release:
    name: Publish
    needs: [check, bird, app]
    runs-on: ubuntu-24.04
    # The signing key is a secret of this environment, which requires the
    # owner's approval before the job runs: pushing a tag alone can't sign.
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # Full history for the release notes (commits since the previous tag).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Sign SHA256SUMS
        env:
          SIGNING_KEY: ${{ secrets.BIRD_RELEASE_SIGNING_KEY }}
        run: |
          [ -n "$SIGNING_KEY" ] || { echo "BIRD_RELEASE_SIGNING_KEY is not set in the release environment"; exit 1; }
          umask 077
          key="$RUNNER_TEMP/release-key"
          printf '%s\n' "$SIGNING_KEY" > "$key"
          rm -f dist/SHA256SUMS.sig # ssh-keygen would ask before overwriting
          ssh-keygen -Y sign -f "$key" -n bird-release dist/SHA256SUMS
          rm -f "$key"
          # The signature must verify against the keys compiled into this
          # release's bird, or `bird self-update` would refuse it.
          awk '/^pub const RELEASE_KEYS/,/\];$/' src/signing.rs |
            grep -oE '"ssh-ed25519 [A-Za-z0-9+/=]+[^"]*"' | tr -d '"' |
            sed 's/^/bird-release /' > "$RUNNER_TEMP/allowed_signers"
          [ -s "$RUNNER_TEMP/allowed_signers" ] || { echo "src/signing.rs has no RELEASE_KEYS"; exit 1; }
          ssh-keygen -Y verify -f "$RUNNER_TEMP/allowed_signers" -I bird-release -n bird-release \
            -s dist/SHA256SUMS.sig < dist/SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          prev="$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)"
          {
            echo "## Changes"
            echo
            git log --no-merges --format='- %s' "${prev:+$prev..}$TAG" | grep -v '^- Release [0-9]' || true
            echo
            echo "Install or update with \`bird self-update\`. Every file is listed in \`SHA256SUMS\`, which is"
            echo "signed with Bird's release key (\`SHA256SUMS.sig\`); build provenance can be checked with"
            echo "\`gh attestation verify <file> -R ${GITHUB_REPOSITORY}\`."
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* --verify-tag --latest --title "Bird $TAG" --notes-file "$RUNNER_TEMP/notes.md"
