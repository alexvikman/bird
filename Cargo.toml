[package]
name = "bird"
version = "0.4.10"
edition = "2024"
license = "MIT"
repository = "https://github.com/alexvikman/bird"

[lints.clippy]
# Every unsafe block says why it is sound (a "// SAFETY:" comment).
undocumented_unsafe_blocks = "warn"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
flate2 = "1.1.10"
futures-util = "0.3.34"
http = "1.5.0"
http-body = "1"
http-body-util = { version = "0.1.5", features = ["channel"] }
hyper = { version = "1.12.0", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server-auto", "server-graceful", "client-legacy", "http1", "http2"] }
libc = "0.2.190"
rcgen = { version = "0.14.10", features = ["pem", "ring", "x509-parser"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls-no-provider"] }
ring = "0.17"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tar = "0.4.46"
time = "0.3.55"
tokio = { version = "1.53.3", features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "logging", "tls12"] }
toml = "1.1.8"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
x509-parser = "0.18"

[profile.release]
lto = "thin"
strip = true

[dev-dependencies]
rustls-webpki = { version = "0.103", default-features = false, features = ["ring", "std"] }
